name: Check generated format files

on:
  pull_request:
    branches: [alpha]

jobs:
  check-formats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsx scripts/generate-formats.ts

      - name: Verify generated files are up to date
        run: |
          if ! git diff --exit-code src/formats/; then
            echo "::error::Generated format files are stale. Run 'npm run generate:formats' and commit the changes."
            exit 1
          fi
