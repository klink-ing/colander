name: Generate format files

on:
  pull_request:
    branches: [alpha]

permissions:
  contents: write

jobs:
  generate-formats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsx scripts/generate-formats.ts

      - name: Commit generated formats if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/formats/
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate format files"
            git push
          fi
