name: Sync generated files

# Runs on every PR rather than a hand-maintained paths filter: the generator
# input graph (markdoc lib, render-jsx, config, package TSDoc, ...) drifts too
# easily, and commit-if-changed exits clean when nothing was regenerated.
on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: ".node-version"
          cache: true
          run-install: true

      - name: Regenerate format files
        run: vp run @klinking/colander#generate-formats

      - name: Commit format files if changed
        run: >-
          bash scripts/commit-if-changed.sh
          "chore: regenerate format files [skip ci]"
          package/src/formats/

      - name: Regenerate doc files via build
        run: vp run website#build

      - name: Commit doc files if changed
        run: >-
          bash scripts/commit-if-changed.sh
          "chore: regenerate doc files [skip ci]"
          website/src/routes/docs/
          website/src/docs-data/
          website/api-data/
          website/src/routeTree.gen.ts
