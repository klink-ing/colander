name: Sync generated files

on:
  pull_request:
    branches: [main]
    paths:
      - package/src/index.ts
      - package/scripts/generate-formats.ts
      - package/src/formats/**
      - website/content/docs/**
      - website/src/lib/markdoc.ts
      - website/src/components/markdoc-tags.ts
      - website/plugins/generate-docs.ts
      - website/src/routes/docs/**
      - website/src/docs-data/**

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: ".node-version"
          cache: true
          run-install: true

      - name: Regenerate format files
        run: vp run @klinking/colander#generate-formats

      - name: Commit format files if changed
        run: >-
          bash scripts/commit-if-changed.sh
          "chore: regenerate format files [skip ci]"
          package/src/formats/

      - name: Regenerate doc files via build
        run: vp run website#build

      - name: Commit doc files if changed
        run: >-
          bash scripts/commit-if-changed.sh
          "chore: regenerate doc files [skip ci]"
          website/src/routes/docs/
          website/src/docs-data/
