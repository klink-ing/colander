# This site is the `website` package of a pnpm-workspace monorepo. The Netlify
# project's base directory is `website`, so the build runs with the working
# directory at website/ and publish/functions are relative to website/.
#
# Build with `pnpm build` (the website's own vite@8), NOT `vp run website#build`.
# Building through vp hangs in Netlify's build container (18-minute timeout) at
# the vite-build step. A direct-invocation diagnostic proved pnpm/vite@8 builds
# cleanly here in ~75s — it is specifically vp's orchestration that stalls, not
# the cache, the Node version, the Next.js runtime, the vite-plus version, or
# scripts/extract-api.ts. vp remains the toolchain for local dev and CI.
#
# Node is pinned via website/.node-version (24.14.1): once the base directory is
# a subdir, Netlify stops reading the repo-root .node-version and otherwise
# falls back to Node 22 (engines want >=24.14.1).
[build]
command = "pnpm build"
publish = "dist/client"

[functions]
directory = ".netlify/v1/functions"
