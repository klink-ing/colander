# This site is the `website` package of a pnpm-workspace monorepo. The Netlify
# project's base directory is set to `website`, so the build runs with the
# working directory at website/ — publish/functions are relative to website/.
#
# Build via vp so the vite-plus task graph governs build order. (Earlier this
# hung on Netlify with vite-plus 0.1.18; testing whether 0.1.24 resolves it. If
# it still hangs, fall back to `pnpm build`, which runs the website's own
# vite@8 directly.)
#
# Node is pinned via website/.node-version (24.14.1) — once the base directory
# is a subdir, Netlify stops reading the repo-root .node-version and otherwise
# falls back to Node 22 (engines want >=24.14.1).
[build]
command = "vp run website#build"
publish = "dist/client"

[functions]
directory = ".netlify/v1/functions"
