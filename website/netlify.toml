# This site is the `website` package of a pnpm-workspace monorepo. The Netlify
# project's base directory is `website`, so the build runs with cwd=website and
# publish/functions are relative to website/.
#
# Build with `pnpm build`, NOT `vp run website#build`. Running the build through
# vp hangs in Netlify's build container at `vite build` (extract-api completes,
# then no output → 18-minute timeout). We confirmed it is NOT the build cache,
# the Node version, the (since-removed) Next.js runtime, or the vite-plus
# version — it still hangs on vite-plus 0.1.24. `pnpm build` runs the website's
# own vite@8 and builds cleanly.
#
# Nothing is lost by skipping vp here: the `website#build` task declares no vp
# `dependsOn` (the run.tasks graph is empty) and the site imports
# `@klinking/colander` from ../package/src (source), so there are no build
# dependencies for vp to order. vp remains the toolchain for local dev and CI.
#
# Node is pinned via website/.node-version (24.14.1): once the base directory is
# a subdir, Netlify stops reading the repo-root .node-version and otherwise
# falls back to Node 22 (engines want >=24.14.1).
[build]
command = "pnpm build"
publish = "dist/client"

[functions]
directory = ".netlify/v1/functions"
